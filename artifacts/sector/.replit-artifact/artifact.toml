kind = "mobile"
previewPath = "/"
title = "Sector"
description = "A native iPhone navigation and journey-performance app with clear turn-by-turn guidance, automatic sector timing, and persistent journey history. The first stage establishes the Sector mobile foundation before the real navigation proof of concept."
version = "1.0.0"
id = "artifacts/sector"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18872

[services.development]
run = "pnpm --filter @workspace/sector run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sector", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/sector", "run", "serve" ]

[services.env]
PORT = "18872"
BASE_PATH = "/"
