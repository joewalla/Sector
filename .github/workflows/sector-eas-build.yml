name: Sector cloud development build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        type: choice
        default: ios-simulator
        options:
          - ios-simulator
          - ios-device
          - android

permissions:
  contents: read

jobs:
  build:
    name: Submit ${{ inputs.target }} build to EAS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Expo SDK dependency alignment
        working-directory: artifacts/sector
        run: pnpm exec expo install --check

      - name: Check Expo token is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::error::Add EXPO_TOKEN as a GitHub Actions repository secret before running this workflow."
            exit 1
          fi

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Select build profile
        id: target
        env:
          BUILD_TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          case "$BUILD_TARGET" in
            ios-simulator)
              echo "platform=ios" >> "$GITHUB_OUTPUT"
              echo "profile=development-simulator" >> "$GITHUB_OUTPUT"
              ;;
            ios-device)
              echo "platform=ios" >> "$GITHUB_OUTPUT"
              echo "profile=development" >> "$GITHUB_OUTPUT"
              ;;
            android)
              echo "platform=android" >> "$GITHUB_OUTPUT"
              echo "profile=development" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unsupported build target: $BUILD_TARGET"
              exit 1
              ;;
          esac

      - name: Queue cloud build
        working-directory: artifacts/sector
        env:
          EAS_PLATFORM: ${{ steps.target.outputs.platform }}
          EAS_PROFILE: ${{ steps.target.outputs.profile }}
        run: eas build --platform "$EAS_PLATFORM" --profile "$EAS_PROFILE" --non-interactive --no-wait
